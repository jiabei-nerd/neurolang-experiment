<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>磷光点模式学习实验</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
    <style>
        body { background-color: #333; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .jspsych-content { max-width: 800px; }
        .stimulus-img {
            width: 200px; height: 200px;
            border: 2px solid #555; border-radius: 4px;
            image-rendering: pixelated;
        }
        .feedback-correct { color: #2ecc71; font-size: 28px; font-weight: bold; }
        .feedback-incorrect { color: #e74c3c; font-size: 28px; font-weight: bold; }
        .feedback-answer { color: #ecf0f1; font-size: 20px; margin-top: 10px; }
        .trial-counter { color: #888; font-size: 14px; margin-bottom: 10px; }
        .progress-bar {
            width: 300px; height: 8px; background: #555;
            border-radius: 4px; margin: 0 auto 15px;
        }
        .progress-fill { height: 100%; background: #3498db; border-radius: 4px; }
        .jspsych-btn {
            min-width: 80px; margin: 3px;
            font-size: 14px; padding: 8px 12px;
        }
        .instructions {
            color: #ecf0f1; text-align: left; max-width: 650px;
            margin: 0 auto; line-height: 1.8;
        }
        .instructions h2 { text-align: center; }
    </style>
</head>
<body>
<script>
const urlParams = new URLSearchParams(window.location.search);
const CONDITION = urlParams.get('condition') || 'symbol';
const PARTICIPANT_ID = urlParams.get('pid') || ('P' + Date.now());
const GOOGLE_SCRIPT_URL = '';

const CLASS_NAMES = [
    '道路畅通', '前方障碍', '左侧有人', '右侧有人',
    '正前方车辆', '侧方车辆', '人行横道', '自行车'
];
const N_CLASSES = CLASS_NAMES.length;
const N_LEARNING_TRIALS = 200;
const N_TEST_TRIALS = 50;
const SAMPLES_PER_CLASS = 25;
const FEEDBACK_DURATION = 1500;
const ITI_DURATION = 500;

function buildStimulusList(nTrials) {
    let list = [];
    for (let i = 0; i < nTrials; i++) {
        let cls = i % N_CLASSES;
        let sample = Math.floor(Math.random() * SAMPLES_PER_CLASS);
        list.push({
            stimulus: `stimuli/${CONDITION}/class${cls}_sample${sample}.png`,
            correct_class: cls,
            correct_name: CLASS_NAMES[cls],
        });
    }
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
}

const learningStimuli = buildStimulusList(N_LEARNING_TRIALS);
const testStimuli = buildStimulusList(N_TEST_TRIALS);
const allImages = [...new Set([...learningStimuli, ...testStimuli].map(s => s.stimulus))];

const jsPsych = initJsPsych({
    on_finish: function() {
        const responseData = jsPsych.data.get().filter({task: 'response'}).values();
        const surveyData = jsPsych.data.get().filter({task: 'survey'}).values();
        const payload = {
            participant: PARTICIPANT_ID, condition: CONDITION,
            trials: responseData.map(t => ({
                phase: t.phase, trial_num: t.trial_num,
                correct_class: t.correct_class, correct_name: t.correct_name,
                response: t.response, correct: t.correct, rt: t.rt
            })),
            survey: surveyData.length > 0 ? surveyData[0].response : null,
        };

        jsPsych.getDisplayElement().innerHTML = `
            <div style="color: #ecf0f1; text-align: center; padding: 50px;">
                <h2>正在保存数据...</h2>
                <p id="upload-status">请稍候</p>
            </div>`;
        const statusEl = document.getElementById('upload-status');

        if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes('YOUR_')) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            })
            .then(() => {
                statusEl.innerHTML = `<span style="color:#2ecc71; font-size:24px;">&#10004; 数据已提交！</span>
                    <br><br>感谢你的参与！<br><span style="color:#888;">编号: ${PARTICIPANT_ID}</span>`;
            })
            .catch(() => { downloadCSV(); });
        } else {
            downloadCSV();
        }

        function downloadCSV() {
            const csv = jsPsych.data.get().filter({task: 'response'}).csv();
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `neurolang_${CONDITION}_${PARTICIPANT_ID}.csv`; a.click();
            statusEl.innerHTML = `<span style="color:#2ecc71; font-size:24px;">&#10004; 实验完成！</span>
                <br><br>数据已自动下载为 CSV 文件。<br><strong>请把下载的文件发给研究者。</strong>
                <br><br><span style="color:#888;">编号: ${PARTICIPANT_ID} | 条件: ${CONDITION}</span>`;
        }
    }
});

let timeline = [];

// 预加载
timeline.push({
    type: jsPsychPreload, images: allImages, show_progress_bar: true,
    message: '<p style="color:#ecf0f1">正在加载实验素材...</p>',
});

// 知情同意
timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div class="instructions">
            <h2>知情同意书</h2>
            <p><strong>实验名称：</strong>视觉假体磷光点模式学习实验</p>
            <p><strong>时间：</strong>约 25-30 分钟</p>
            <p><strong>内容：</strong>你将看到一些由亮点组成的图案（模拟视觉假体用户看到的画面），
            你的任务是学习每个图案对应的场景类别。</p>
            <p><strong>风险：</strong>无特殊风险，可能会有轻微视觉疲劳，可随时休息。</p>
            <p><strong>数据：</strong>所有数据匿名处理，仅记录正确率和反应时间，不收集个人信息。</p>
            <p><strong>自愿：</strong>你可以随时关闭页面退出实验。</p>
            <p>点击"我同意"表示你已年满 18 岁、视力正常（或矫正后正常），并同意参加本实验。</p>
        </div>`,
    choices: ['我同意'],
});

// 指导语
timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div class="instructions">
            <h2>实验说明</h2>
            <p>想象你是一位使用<strong>视觉假体</strong>的患者。假体通过电极刺激大脑，
            让你看到一些<strong>亮点图案</strong>（叫做"磷光点"）。</p>
            <p><strong style="color:#e74c3c;">重要：这些图案和真实场景之间没有视觉上的相似性！</strong></p>
            <p>它们是<strong>抽象的符号</strong>，就像盲文的点和字母没有关系一样。
            你需要通过反复练习和反馈，把每种图案和对应的场景<strong>死记硬背</strong>下来。</p>
            <p>一共有 <strong>${N_CLASSES} 种场景</strong>：</p>
            <p style="text-align:center; font-size: 16px; line-height: 2;">
                ${CLASS_NAMES.map((n, i) => `<strong>${i+1}.</strong> ${n}`).join(' &nbsp;&nbsp; ')}
            </p>
            <p>每次实验：</p>
            <ol>
                <li>屏幕上出现一个亮点图案</li>
                <li>你从下面的按钮中选择你认为它代表的场景</li>
                <li>系统会告诉你对不对，以及正确答案是什么</li>
            </ol>
            <p><strong>一开始你会完全靠猜——这是正常的！</strong>
            注意观察每种图案的特征：亮点的数量、位置、密集程度。
            通过反馈，你会慢慢学会辨认。</p>
            <p>共 <strong>${N_LEARNING_TRIALS} 次学习</strong>（有反馈）+ <strong>${N_TEST_TRIALS} 次测试</strong>（无反馈）。</p>
        </div>`,
    choices: ['开始实验'],
});

// 练习
timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="instructions">
        <h2>练习环节</h2>
        <p>先来 5 次练习，熟悉一下操作。</p>
    </div>`,
    choices: ['开始练习'],
});

for (let i = 0; i < 5; i++) {
    let stim = learningStimuli[i];
    timeline.push({
        type: jsPsychImageButtonResponse,
        stimulus: stim.stimulus, stimulus_width: 200, stimulus_height: 200,
        choices: CLASS_NAMES,
        prompt: `<div class="trial-counter">练习 ${i+1}/5</div>`,
        data: { task: 'practice', correct_class: stim.correct_class, condition: CONDITION },
        on_finish: function(data) { data.correct = parseInt(data.response) === data.correct_class; }
    });
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            let last = jsPsych.data.get().last(1).values()[0];
            let name = CLASS_NAMES[last.correct_class];
            return last.correct
                ? `<div class="feedback-correct">&#10004; 正确！</div><div class="feedback-answer">${name}</div>`
                : `<div class="feedback-incorrect">&#10008; 不对</div><div class="feedback-answer">正确答案：${name}</div>`;
        },
        choices: 'NO_KEYS', trial_duration: FEEDBACK_DURATION,
    });
}

// 正式学习
timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="instructions">
        <h2>正式学习</h2>
        <p>接下来是 ${N_LEARNING_TRIALS} 次正式学习，每次都有反馈。</p>
        <p>尽力记住每种图案对应的场景！</p>
    </div>`,
    choices: ['开始'],
});

for (let i = 0; i < N_LEARNING_TRIALS; i++) {
    let stim = learningStimuli[i];
    let pct = ((i+1) / N_LEARNING_TRIALS * 100).toFixed(0);

    timeline.push({
        type: jsPsychImageButtonResponse,
        stimulus: stim.stimulus, stimulus_width: 200, stimulus_height: 200,
        choices: CLASS_NAMES,
        prompt: `<div class="trial-counter">学习：第 ${i+1}/${N_LEARNING_TRIALS} 次</div>
                 <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`,
        data: {
            task: 'response', phase: 'learning', trial_num: i+1,
            correct_class: stim.correct_class, correct_name: stim.correct_name,
            condition: CONDITION, participant: PARTICIPANT_ID,
        },
        on_finish: function(data) { data.correct = parseInt(data.response) === data.correct_class; }
    });

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            let last = jsPsych.data.get().last(1).values()[0];
            let name = CLASS_NAMES[last.correct_class];
            return last.correct
                ? `<div class="feedback-correct">&#10004; 正确！</div><div class="feedback-answer">${name}</div>`
                : `<div class="feedback-incorrect">&#10008; 不对</div><div class="feedback-answer">正确答案：${name}</div>`;
        },
        choices: 'NO_KEYS', trial_duration: FEEDBACK_DURATION,
    });

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="font-size:30px;color:#ecf0f1">+</div>',
        choices: 'NO_KEYS', trial_duration: ITI_DURATION,
    });

    if ((i+1) % 50 === 0 && i+1 < N_LEARNING_TRIALS) {
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                let recent = jsPsych.data.get().filter({task:'response', phase:'learning'}).last(50);
                let acc = (recent.filter({correct:true}).count() / 50 * 100).toFixed(0);
                return `<div class="instructions">
                    <h2>休息一下</h2>
                    <p>已完成 ${i+1}/${N_LEARNING_TRIALS} 次。</p>
                    <p>最近 50 次准确率：<strong>${acc}%</strong></p>
                    <p>休息好了就继续。</p>
                </div>`;
            },
            choices: ['继续'],
        });
    }
}

// 测试阶段
timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="instructions">
        <h2>测试阶段</h2>
        <p>学习阶段结束了！</p>
        <p>接下来 <strong>${N_TEST_TRIALS} 次测试</strong>，这次<strong>没有反馈</strong>。</p>
        <p>根据你学到的知识，尽力作答。</p>
    </div>`,
    choices: ['开始测试'],
});

for (let i = 0; i < N_TEST_TRIALS; i++) {
    let stim = testStimuli[i];
    timeline.push({
        type: jsPsychImageButtonResponse,
        stimulus: stim.stimulus, stimulus_width: 200, stimulus_height: 200,
        choices: CLASS_NAMES,
        prompt: `<div class="trial-counter">测试：第 ${i+1}/${N_TEST_TRIALS} 次</div>`,
        data: {
            task: 'response', phase: 'test', trial_num: i+1,
            correct_class: stim.correct_class, correct_name: stim.correct_name,
            condition: CONDITION, participant: PARTICIPANT_ID,
        },
        on_finish: function(data) { data.correct = parseInt(data.response) === data.correct_class; }
    });
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="font-size:30px;color:#ecf0f1">+</div>',
        choices: 'NO_KEYS', trial_duration: ITI_DURATION,
    });
}

// 问卷
timeline.push({
    type: jsPsychSurveyLikert,
    questions: [
        { prompt: '你觉得学习这些图案的难度如何？',
          labels: ['非常容易', '容易', '一般', '困难', '非常困难'],
          required: true, name: 'difficulty' },
        { prompt: '你对测试阶段的回答有多大信心？',
          labels: ['完全没信心', '不太有', '一般', '比较有', '非常有'],
          required: true, name: 'confidence' },
        { prompt: '你有没有发现什么记忆策略？',
          labels: ['没有', '有一点', '有明确的策略'],
          required: true, name: 'strategy' },
    ],
    data: { task: 'survey', condition: CONDITION, participant: PARTICIPANT_ID },
});

jsPsych.run(timeline);
</script>
</body>
</html>
